<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Password Fast</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #2d2d2d;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .title {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: #a0a0a0;
            word-wrap: break-word;
        }

        .password {
            font-size: 1.2rem;
            font-weight: bold;
            background-color: #181818;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            letter-spacing: 1px;
            color: #4CAF50;
            word-break: break-all;
            filter: blur(6px);
            transition: filter 0.3s ease;
            user-select: none;
        }

        .password.unblurred {
            filter: blur(0);
            user-select: text; 
        }

        .password.error {
            filter: blur(0);
            color: #f44336;
            font-size: 1rem;
        }

        .copy-btn {
            background-color: #007acc;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
            font-weight: bold;
        }

        .copy-btn:hover:not(:disabled) {
            background-color: #005f9e;
        }
        
        .copy-btn:disabled {
            background-color: #555;
            cursor: not-allowed;
            color: #999;
        }

        #toast {
            visibility: hidden;
            min-width: 200px;
            background-color: #4CAF50;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 12px;
            position: fixed;
            z-index: 1;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        #toast.error {
            background-color: #f44336;
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="title" id="title-display">Đây là pass của apk????</div>
        <div class="password" id="pass-display">xxxxxxxxx</div>
        <button class="copy-btn" id="copy-btn" disabled>Copy Password</button>
    </div>

    <div id="toast">Đã copy!</div>

    <script>
        const passDisplay = document.getElementById('pass-display');
        const titleDisplay = document.getElementById('title-display');
        const copyBtn = document.getElementById('copy-btn');
        const toast = document.getElementById('toast');
        
        let actualPassword = "";

        // Lấy ID từ URL
        const urlParams = new URLSearchParams(window.location.search);
        const pastefyId = urlParams.get('id');

        if (pastefyId) {
            titleDisplay.innerText = "Đang tải dữ liệu siêu tốc...";

            // Sinh nonce ngẫu nhiên + timestamp -> chống trùng cache key ở phía proxy
            // (chỉ dùng timestamp có thể bị proxy chuẩn hoá/trùng giây)
            function cacheBuster() {
                return `${Date.now()}_${Math.random().toString(36).slice(2, 10)}`;
            }

            async function fetchWithValidation(url, isApi = false, timeoutMs = 6000) {
                const controller = new AbortController();
                const timer = setTimeout(() => controller.abort(), timeoutMs);
                try {
                    const response = await fetch(url, {
                        cache: 'no-store',
                        signal: controller.signal
                    });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);

                    if (isApi) {
                        const data = await response.json();
                        if (data && data.paste && typeof data.paste.content === 'string' && data.paste.content.length > 0) {
                            return data.paste.content;
                        }
                        throw new Error("API: không có nội dung");
                    } else {
                        const text = await response.text();
                        const trimmed = text.trim();
                        // Chặn trường hợp proxy trả về trang lỗi/HTML/Cloudflare thay vì raw text
                        if (!trimmed || trimmed.startsWith("<") || trimmed.includes("Cloudflare")) {
                            throw new Error("Nội dung không hợp lệ từ proxy");
                        }
                        return text;
                    }
                } finally {
                    clearTimeout(timer);
                }
            }

            // QUAN TRỌNG: gọi TUẦN TỰ theo thứ tự ưu tiên, KHÔNG dùng Promise.any/race.
            // Lý do bug cũ: race lấy kết quả VỀ NHANH NHẤT, không phải MỚI NHẤT.
            // Các proxy free (allorigins/corsproxy/codetabs) hay tự cache theo URL đích ở
            // server của họ -> proxy nào đang có bản cache cũ luôn trả lời nhanh nhất và
            // "thắng" cuộc đua, nên trang cứ hiện pass cũ dù Pastefy đã đổi.
            // Ưu tiên API gốc của Pastefy trước tiên vì đó là nguồn gốc, không qua cache trung gian.
            async function buildSources() {
                const nonce = cacheBuster();
                const rawUrl = `https://pastefy.app/${pastefyId}/raw?nocache=${nonce}`;
                return [
                    { url: `https://api.pastefy.app/api/v2/paste/${pastefyId}?nocache=${nonce}`, isApi: true },
                    { url: `https://api.allorigins.win/raw?url=${encodeURIComponent(rawUrl)}&_nc=${nonce}`, isApi: false },
                    { url: `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(rawUrl)}&_nc=${nonce}`, isApi: false },
                    { url: `https://corsproxy.io/?url=${encodeURIComponent(rawUrl)}&_nc=${nonce}`, isApi: false }
                ];
            }

            async function fetchSequential(sources) {
                let lastErr = null;
                for (const src of sources) {
                    try {
                        return await fetchWithValidation(src.url, src.isApi);
                    } catch (e) {
                        lastErr = e; // thử nguồn kế tiếp
                    }
                }
                throw lastErr || new Error("Tất cả nguồn đều thất bại");
            }

            function applyPaste(text) {
                const lines = text.split('\n');

                if (lines[0] && lines[0].trim() !== "") {
                    titleDisplay.innerText = `Đây là pass của ${lines[0].trim()}`;
                }

                const match = text.match(/👉\s*(.*)/);
                if (match) {
                    actualPassword = match[1].trim();
                } else if (lines.length > 1) {
                    actualPassword = lines[1].trim();
                } else {
                    actualPassword = text.trim();
                }

                passDisplay.innerText = actualPassword;
                copyBtn.disabled = false;
                copyBtn.innerText = "Copy Password";
            }

            async function loadPaste(attempt = 1) {
                const maxAttempts = 3;
                try {
                    const sources = await buildSources();
                    const text = await fetchSequential(sources);
                    applyPaste(text);
                } catch (err) {
                    // Retry để tránh báo nhầm "đã bị xóa" khi chỉ là lỗi mạng/proxy tạm thời
                    if (attempt < maxAttempts) {
                        await new Promise(r => setTimeout(r, 500 * attempt));
                        return loadPaste(attempt + 1);
                    }
                    console.error("Tất cả máy chủ đều không tải được", err);
                    titleDisplay.innerText = "Lỗi tải dữ liệu!";
                    passDisplay.innerText = "Sai ID hoặc Paste đã bị xóa.";
                    passDisplay.classList.add('error');
                    copyBtn.innerText = "Lỗi";
                }
            }

            loadPaste();
        }

        // Xử lý sự kiện click nút Copy (Sử dụng cách tương thích cao nhất)
        copyBtn.addEventListener('click', () => {
            if (!actualPassword) return;

            // Tạo một thẻ textarea ẩn để copy (Tránh lỗi trên Iframe/Trình duyệt cũ)
            const textArea = document.createElement("textarea");
            textArea.value = actualPassword;
            // Đặt vị trí ẩn để không làm nhảy trang web
            textArea.style.position = "fixed";
            textArea.style.top = "-9999px";
            document.body.appendChild(textArea);
            
            textArea.focus();
            textArea.select();

            try {
                // Thực thi lệnh copy
                const successful = document.execCommand('copy');
                if (successful) {
                    passDisplay.classList.add('unblurred');
                    toast.innerText = "Đã copy thành công!";
                    toast.classList.remove('error');
                    toast.classList.add('show');
                    
                    setTimeout(() => {
                        passDisplay.classList.remove('unblurred');
                        toast.classList.remove('show');
                    }, 2000);
                } else {
                    throw new Error("Trình duyệt từ chối copy");
                }
            } catch (err) {
                // Xử lý lỗi thay vì dùng alert()
                toast.innerText = "Trình duyệt chặn copy!";
                toast.classList.add('error');
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }
            
            // Xóa thẻ tạm
            document.body.removeChild(textArea);
        });
    </script>
</body>
</html>
